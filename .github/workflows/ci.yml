name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: backend

  app:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to publish the download link from main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Builds with the example config (guest mode, no backend). Add a
      # repository secret APP_CONFIG_JSON holding your config/dev.json to build
      # a fully connected APK; the values are public client IDs, not secrets,
      # but keeping them out of git avoids accidental reuse.
      - name: Write build config
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if [ -n "$APP_CONFIG_JSON" ]; then
            printf '%s' "$APP_CONFIG_JSON" > config/build.json
          else
            cp config/dev.example.json config/build.json
          fi
      # Optional: repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD give every CI APK the same
      # signature, so testers can install updates over the old version.
      - name: Release signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PW" "$KEY_ALIAS" "$KEY_PW" > android/key.properties
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "No signing secrets; APK is debug-signed."
          fi
      # Without signing secrets, sign with the public test key in the repo, so
      # every test APK has the same signature and installs over the last one.
      # Test builds only: add the secrets above before any store release.
      - name: Test signing key (no secrets)
        if: env.HAS_SIGNING != 'true'
        run: |
          printf 'storeFile=test-signing.jks\nstorePassword=testbuild\nkeyAlias=test\nkeyPassword=testbuild\n' > android/key.properties
      # A rising build number lets Android treat each APK as an update, and
      # shows testers which build they have (Profile, at the bottom).
      - run: >-
          flutter build apk --release --split-per-abi
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=BUILD_SHA=${{ github.sha }}
          --dart-define-from-file=config/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: mumbai-smart-commute-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
      # Every build of main replaces the "latest-build" release, so testers
      # always have the same direct link (no GitHub account needed):
      # https://github.com/<owner>/<repo>/releases/download/latest-build/app-arm64-v8a-release.apk
      - name: Publish download link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build build/app/outputs/flutter-apk/*.apk \
            --target "$GITHUB_SHA" --prerelease --title "Latest test build" \
            --notes "Built from $GITHUB_SHA. Most phones: app-arm64-v8a-release.apk. Older phones: app-armeabi-v7a-release.apk."
